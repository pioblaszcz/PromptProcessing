services:
  postgres:
    image: postgres:17
    container_name: prompt-processing-postgres
    environment:
      POSTGRES_DB: prompt_processing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: prompt-processing-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  ollama:
    image: ollama/ollama:latest
    container_name: prompt-processing-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama-model:
    image: ollama/ollama:latest
    container_name: prompt-processing-ollama-model
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: ["pull", "llama3.2:1b"]
    restart: "no"

volumes:
  postgres-data:
  rabbitmq-data:
  ollama-data:
